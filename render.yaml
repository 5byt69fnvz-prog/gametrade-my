services:
  - type: web
    name: gametrade-my-preview
    runtime: node
    region: singapore
    # Free preview plan: spins down when idle. Upgrade to starter for production.
    plan: free
    buildCommand: npm ci && npm run db:migrate && npm run db:seed && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: gametrade-my-preview-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: APP_URL
        value: https://gametrade-my-preview.onrender.com
      - key: INITIAL_ADMIN_NAME
        value: GameTrade MY Admin
      - key: INITIAL_ADMIN_EMAIL
        value: admin@gametrade.my
      - key: INITIAL_ADMIN_PHONE
        value: "+60123456789"
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        value: preview-no-resend
      - key: EMAIL_FROM
        value: GameTrade MY <verify@example.com>
      - key: S3_ENDPOINT
        value: https://example.invalid
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: gametrade-preview
      - key: S3_ACCESS_KEY_ID
        value: preview
      - key: S3_SECRET_ACCESS_KEY
        value: preview
      - key: S3_PUBLIC_BASE_URL
        value: https://example.invalid
      - key: PAYMENT_BANK_NAME
        value: GameTrade MY Demo Collection
      - key: PAYMENT_BANK_ACCOUNT
        value: Maybank 5622 1188 7091
      - key: PAYMENT_DUITNOW_ID
        value: gametrade.my@example.com

databases:
  - name: gametrade-my-preview-db
    databaseName: gametrade_preview
    user: gametrade
    region: singapore
    # Free preview database expires after 30 days. Upgrade to basic-256mb for production.
    plan: free
