services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gametrade
      POSTGRES_USER: gametrade
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - gametrade_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gametrade -d gametrade"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gametrade_postgres:
